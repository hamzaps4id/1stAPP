name: Build and Release Grandma Clock APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grandma-clock-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: GrandmaClock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.3.0 --yes || true
          gh release create v1.3.0 app/build/outputs/apk/debug/app-debug.apk \
            --title "ساعة جدتي v1.3.0" \
            --notes "نسخة v1.2 من تطبيق ساعة جدتي مع أرقام كبيرة وخيارات لتغيير الخلفية: ساعة عقارب كبيرة وواضحة، تعمل بملء الشاشة وتبقي الشاشة مضاءة أثناء تشغيل التطبيق."
