name: Release Grandma Clock v1.4

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Saat-AlKibar.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.4.0 --yes || true
          gh release create v1.4.0 "app/build/outputs/apk/debug/Saat-AlKibar.apk" \
            --title "ساعة الكبار v1.4.0" \
            --notes "إصدار v1.4: تم تغيير اسم التطبيق إلى ساعة الكبار، واسم ملف التثبيت إلى Saat-AlKibar.apk."
